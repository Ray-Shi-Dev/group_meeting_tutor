name: offline-tests

# Runs the end-to-end test on GitHub-hosted machines on every push (fake server, no secrets needed).
# The result goes to results/offline.md on the ci-results branch so both Claudes can read it with git.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install -q reportlab tomli
      - name: End-to-end test
        id: run
        run: |
          set -o pipefail
          python tests/test_pipeline.py 2>&1 | tee test.log
          python tests/test_mm_setup.py 2>&1 | tee -a test.log
      - name: Collect result
        if: always()
        run: |
          {
            echo "### Python ${{ matrix.python }}: ${{ steps.run.outcome }}"
            echo '```'
            grep -v '^\[20' test.log | tail -n 25 || true
            echo '```'
          } > "offline-${{ matrix.python }}.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-${{ matrix.python }}
          path: offline-${{ matrix.python }}.md

  publish:
    needs: test
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
      - name: Publish to ci-results
        run: |
          {
            echo "# Offline test result"
            echo
            echo "- Commit: ${GITHUB_SHA:0:12}"
            echo "- Time (UTC): $(date -u '+%Y-%m-%d %H:%M')"
            echo "- Overall: ${{ needs.test.result }}"
            echo
            cat parts/offline-*.md
          } > offline.md
          tools/publish_result.sh offline.md offline.md
