# Copy to config.toml and fill in real values (or let tools/mm_setup.py write it for you).
# The token never goes in this file: use the MM_BOT_TOKEN environment variable or token_file.

[mattermost]
base_url = "https://mattermost.example.edu"
channel_id = ""                 # id of the group meeting channel
token_file = "/etc/lab-summarizer/mm_token"   # must be chmod 600
maintainer_username = ""        # run reports are sent to this account by direct message
reply_mode = "test_channel"     # test_channel during the trial; thread once live
test_channel_id = ""            # required when reply_mode = test_channel

[schedule]
timezone = "Asia/Taipei"
window_weekday = 2              # scan starts at the previous Wednesday (0 = Monday)
window_hour = 12                # ... at 12:00
budget_sec = 1800               # deadline for the whole batch: start 08:30, finish by 09:00

[sources]
max_download_mb = 60
max_pages = 150
enable_html_attachments = false # runs attached HTML in a headless browser; assess the risk first

[llm]
claude_bin = "/usr/local/bin/claude"   # must be absolute when isolation_user is set
isolation_user = "claude-runner"       # set this or allow_direct, not both
allow_direct = false                   # true only if the whole program runs in a dedicated low-privilege account or container
vision_timeout_sec = 420               # ~70 s measured for 30 synthetic pages; keep headroom
text_timeout_sec = 90
claude_max_vision_pages = 32
enable_ollama_fallback = false         # keep off during the trial: if Claude fails, skip and notify
ollama_url = "http://127.0.0.1:11434/api/chat"
ollama_model = "qwen2.5vl:7b"          # confirm the name with `ollama list`

[paths]
db_path = "/var/lib/lab-summarizer/state.sqlite3"
work_root = ""                  # empty = system temp directory
exchange_root = "/var/tmp"      # where slide images are handed to isolation_user
